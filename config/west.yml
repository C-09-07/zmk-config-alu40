manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    # Pinned: ZMK main moved to Zephyr 4.1, which no longer accepts this
    # board's hardware model v1 definition in boards/arm/alu40.
    # This repo is loaded as a module itself via zephyr/module.yml.
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
  self:
    path: config
