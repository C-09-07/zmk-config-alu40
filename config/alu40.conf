# If you accidentally unbind &studio_unlock, uncomment to disable locking and reflash to get yourself back in.
# Permanently disabling locking is not advised as that will allow any program to change your keymap at any time.
#CONFIG_ZMK_STUDIO_UNLOCK=n

# Uncomment to disable underglow.
#CONFIG_ZMK_RGB_UNDERGLOW=n

# Increase wireless transmission power at the cost of a little battery life.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Some operating systems (currently macOS, Android) have problems with full support for consumer keycodes.
# If yours does not, comment this out in order for keycodes like C_AL_CALC to work.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Bluetooth stability fixes for macOS.

# The board enables BLE privacy, which upstream ZMK does not use. The keyboard
# then advertises from a rotating random address, and a Mac that has lost the
# bond lists every new address as another "ALU40". Use one stable address.
CONFIG_BT_PRIVACY=n

# Disable 2M PHY and allow a host to re-pair over its stale bond on the same
# profile instead of being rejected. Re-pairing then asks for the 6-digit code
# shown on the Mac to be typed on the keyboard, followed by Enter.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# Drop links that never become encrypted so the Mac reconnects (src/ble_recovery.c).
CONFIG_ALU40_BLE_RECOVERY=y
